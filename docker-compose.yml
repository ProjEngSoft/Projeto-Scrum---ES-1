services:
  postgres:
    image: postgres:16-alpine
    container_name: conserta_aqui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conserta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conserta123}
      POSTGRES_DB: ${POSTGRES_DB:-conserta_aqui}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conserta} -d ${POSTGRES_DB:-conserta_aqui}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
